<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <meta name="description" content="Roll a single ten-sided die, beautifully." />
    <meta name="color-scheme" content="dark" />
    <title>d10 — roll a ten-sided die</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <h1 class="title"><b>d</b>10</h1>

    <div class="stage" id="stage">
      <!-- A real pentagonal trapezohedron simulated and drawn in 3D each frame
           on this canvas (geometry + math in die3d.ts, the rigid-body sim in
           physics.ts, drawing + drag in main.ts). The canvas itself is the
           grabbable die and is keyboard-operable. -->
      <canvas
        id="dieCanvas"
        tabindex="0"
        role="button"
        aria-label="Ten-sided die, showing 10. Drag it to throw, or press Enter to roll."
      ></canvas>

      <div class="sparks" id="sparks" aria-hidden="true"></div>
    </div>

    <p class="hint" aria-hidden="true">Grab the die and fling it — or press Roll.</p>

    <button class="roll-btn" id="rollBtn" type="button">Roll</button>

    <div class="sr-only" id="live" aria-live="polite" role="status"></div>
  </body>
</html>
