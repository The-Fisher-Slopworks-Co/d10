<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <meta name="description" content="Roll a single ten-sided die, beautifully." />
    <meta name="color-scheme" content="dark" />
    <title>d10 — roll a ten-sided die</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <h1 class="title"><b>d</b>10</h1>

    <div class="stage" id="stage">
      <div class="shadow" id="shadow" aria-hidden="true"></div>

      <div
        class="die-wrap"
        id="die"
        tabindex="0"
        role="button"
        aria-label="Ten-sided die, currently showing 10. Activate to roll."
      >
        <!-- A real pentagonal trapezohedron rendered in 3D each frame on this
             canvas (geometry + math in die3d.ts, drawing in main.ts). -->
        <canvas id="dieCanvas" aria-hidden="true"></canvas>
      </div>

      <div class="sparks" id="sparks" aria-hidden="true"></div>
    </div>

    <button class="roll-btn" id="rollBtn" type="button">Roll</button>

    <div class="sr-only" id="live" aria-live="polite" role="status"></div>
  </body>
</html>
